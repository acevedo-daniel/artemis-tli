name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  production:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compilar con advertencias como errores
        run: make

      - name: Ejecutar las pruebas de cálculo
        run: make pruebas

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required upstream jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then echo "::error::A required job finished with: $result"; exit 1; fi
          done
